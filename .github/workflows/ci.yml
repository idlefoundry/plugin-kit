# On macOS, Windows and Linux: formatting, clippy and the kit's tests, on Linux with ngspice 47
# required (built from its source release, checked and cached), so that the ngspice runner's
# tests run rather than skip. The vendored crates (third_party/) are built by the plug-ins that
# take them, not here (docs/decisions.md K1), but for nih-plug's core, which plugin-kit-learn
# builds (K3); their own tests of the kit's changes run here (K-CA72-0.2.8): baseview's window
# tests (on Linux one under Xvfb), nih-plug's of its wrappers and standalone adapter, and
# clap-wrapper's of its proxy's host capability.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
          - { name: Linux, os: ubuntu-22.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Audio and ngspice libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libreadline-dev bison flex libx11-dev libx11-xcb-dev libxcb1-dev xvfb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: ngspice 47, cached
        if: runner.os == 'Linux'
        id: ngspice
        uses: actions/cache@v5
        with:
          path: ~/.local/opt/ngspice-47
          key: ngspice-47-${{ matrix.os }}

      - name: ngspice 47, built
        if: runner.os == 'Linux' && steps.ngspice.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o ngspice-47.tar.gz https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/47/ngspice-47.tar.gz
          echo "894e649651f1838a14095e5a5439e7d3aa63e87ede14d283173fda4fcdef675f  ngspice-47.tar.gz" | sha256sum -c -
          tar xzf ngspice-47.tar.gz
          cd ngspice-47 && mkdir release && cd release
          ../configure --prefix="$HOME/.local/opt/ngspice-47" --with-readline=yes --enable-openmp --without-x --disable-debug
          make -j"$(nproc)"
          make install

      - name: Tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export REQUIRE_NGSPICE=1; fi
          cargo test --workspace --no-fail-fast

      - name: Typed persistent-field derive tests
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/plugin-kit-derive" cargo test --manifest-path third_party/nih-plug/nih_plug_derive/Cargo.toml

      # baseview's own: the X11 requests (every system), the Windows windows' styles and keys,
      # the macOS windows' scale and quitting (on the main thread), and on Linux under Xvfb a
      # window grown and a key held through the server's repeats (third_party/baseview/PATCHES.md,
      # changes 6, 8 to 12 and 14).
      - name: baseview's window tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/plugin-kit-vendored
        run: |
          cargo test --manifest-path third_party/baseview/Cargo.toml --no-fail-fast
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --manifest-path third_party/baseview/Cargo.toml --test x11_expose --test x11_key_repeat -- --ignored --test-threads=1
          fi

      # nih-plug's: the CLAP wrapper's host capability, VST3's note expressions and the production
      # standalone's adapter (third_party/nih-plug/PATCHES.md, changes 18 to 22).
      - name: nih-plug's wrapper and standalone tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/plugin-kit-vendored
        run: cargo test --manifest-path third_party/nih-plug/Cargo.toml --features vst3,standalone-production --lib -- visibility_tests note_expressions production

      # clap-wrapper's: the AUv2 wrapper's host capability on the real proxy dispatcher
      # (third_party/clap-wrapper/PATCHES.md, change 7).
      - name: clap-wrapper's host capability test
        if: runner.os != 'Windows'
        working-directory: third_party/clap-wrapper
        run: |
          libs=""; if [ "$RUNNER_OS" = Linux ]; then libs="-ldl"; fi
          c++ -std=c++17 -DCLAP_WRAPPER_VERSION='"0.16.0"' -Isrc -Iinclude -Ilibs/fmt -I../clap/include \
            tests/native-window-occlusion.cpp src/clap_proxy.cpp src/detail/clap/fsutil.cpp $libs \
            -o "$RUNNER_TEMP/occlusion-test"
          "$RUNNER_TEMP/occlusion-test"
