[package]
name = "plugin-kit-pool"
description = "The plug-ins' voice workers: a pool held only while an instance needs it, one budget of threads for every process of the user's (seats), even shares that follow the instances, started and stopped by a helper thread, never on the audio thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
plugin-kit-rt = { path = "../plugin-kit-rt" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
