<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3108 925" width="3108" height="925">
  <title>The CC0 starter's panel: a slate face, a band behind each row of controls</title>
  <defs>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="1" stop-color="#1b1f24"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="130" width="3108" height="795" fill="url(#slate)"/>
  <rect x="20" y="148" width="3068" height="220" rx="18" fill="url(#band)"/>
  <rect x="20" y="388" width="3068" height="220" rx="18" fill="url(#band)"/>
  <rect x="20" y="628" width="3068" height="220" rx="18" fill="url(#band)"/>
  <rect x="0" y="130" width="3108" height="6" fill="#000" fill-opacity="0.4"/>
</svg>
