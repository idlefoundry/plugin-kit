# The CC0 starter's layout: every control of the CA-72's panel, in three plain rows, the lamps and
# POWER in the wooden strip. Not the official panel's arrangement: start from this one.
# Dedicated to the public domain under CC0 1.0 (LICENSE.txt). The format: docs/skin-packs.md.

format = 1
# The revision of the CA-72's panel controls this layout was made for.
controls = 3

[fixtures]
power = [3040, -65]
lamp = [2950, -65]
overload = [2860, -65]
ultra = [2730, -65]
plate = [40, -106]
screws = [[400, -65, 7], [1550, -65, 7], [2500, -65, 7]]

[[control]]
param = "tune"
at = [111, 120]

[[control]]
param = "glide"
at = [333, 120]

[[control]]
param = "mod_mix"
at = [555, 120]

[[control]]
param = "osc_mod"
at = [777, 120]
size = [108, 50]
colour = "red"
on = "right"

[[control]]
param = "osc1_range"
at = [999, 120]

[[control]]
param = "osc2_range"
at = [1221, 120]

[[control]]
param = "osc3_range"
at = [1443, 120]

[[control]]
param = "osc2_frequency"
at = [1665, 120]
big = true

[[control]]
param = "osc3_frequency"
at = [1887, 120]
big = true

[[control]]
param = "osc1_waveform"
at = [2109, 120]

[[control]]
param = "osc2_waveform"
at = [2331, 120]

[[control]]
param = "osc3_waveform"
at = [2553, 120]

[[control]]
param = "osc3_control"
at = [2775, 120]
size = [108, 50]
colour = "red"
on = "right"

# Oscillators 2's and 3's TIMED keys (the controls' revision 2), each under its RANGE's legend;
# the note value beside each is the plug-in's print.
[[control]]
param = "osc2_timed"
at = [1221, 256]

[[control]]
param = "osc3_timed"
at = [1443, 256]

# Each oscillator's MOD key (the controls' revision 3), under its WAVEFORM's legend: on the
# panel only while that oscillator's waveform is CONTINUOUS; MOD beside it is the plug-in's print.
