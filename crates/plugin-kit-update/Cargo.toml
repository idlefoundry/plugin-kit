[package]
name = "plugin-kit-update"
description = "The plug-ins' update check, made when the user asks: the latest release on GitHub through the system's curl, its installer for this system opened in the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true

# Windows' shell, which opens a page in the user's browser.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
