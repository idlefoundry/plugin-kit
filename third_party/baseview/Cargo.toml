[workspace]
# Standalone tests must not enable Linux's native XCB feature on macOS or Windows.
resolver = "3"

[package]
name = "baseview"
version = "0.1.0"
authors = [
    "William Light <git@wrl.lhiaudio.com>",
    "Charles Saracco <crsaracco@gmail.com>",
    "Mirko Covizzi <mrkcvzz@gmail.com>",
    "Micah Johnston <micah@glowcoil.com>",
    "Billy Messenger <billydm@protonmail.com>",
    "Anton Lazarev <https://antonok.com>",
    "Joakim Frostegård <joakim.frostegard@gmail.com>",
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
]
edition = "2018"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustAudio/baseview"

[features]
default = []
opengl = ["uuid", "x11/glx"]

[dependencies]
keyboard-types = { version = "0.6.1", default-features = false }
raw-window-handle = "0.5"

[dev-dependencies]
# Record the actual X11 requests in tests, including on macOS and Windows; and hold a key on an
# X server, as a keyboard does (XTEST: `tests/x11_key_repeat.rs`, PATCHES.md change 14).
x11rb = { version = "0.13.0", features = ["xtest"] }

# The macOS window tests (PATCHES.md, changes 8 and 11), the CA-72's: on the main thread, which
# AppKit requires and the test harness runs none on. Elsewhere they do nothing.
[[test]]
name = "backing_scale"
harness = false

[[test]]
name = "mac_quit"
harness = false

[target.'cfg(target_os="macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
softbuffer = { path = "../softbuffer", default-features = false }

[target.'cfg(target_os="linux")'.dependencies]
x11rb = { version = "0.13.0", features = ["cursor", "resource_manager", "allow-unsafe-code"] }
x11 = { version = "2.21", features = ["xlib", "xlib_xcb"] }
nix = "0.22.0"

[target.'cfg(target_os="windows")'.dependencies]
winapi = { version = "0.3.8", features = ["libloaderapi", "winuser", "windef", "minwindef", "guiddef", "combaseapi", "wingdi", "errhandlingapi", "ole2", "oleidl", "shellapi", "winerror", "processthreadsapi"] }
uuid = { version = "0.8", features = ["v4"], optional = true }

[target.'cfg(target_os="macos")'.dependencies]
cocoa = "0.24.0"
core-foundation = "0.9.1"
objc = "0.2.7"
uuid = { version = "0.8", features = ["v4"] }

[lints.clippy]
missing-safety-doc = "allow"
# Upstream's manual MouseCursor::default at this revision.
derivable_impls = "allow"

# Upstream's own warnings at this commit, with the Rust the CA-72 builds with (PATCHES.md).
[lints.rust]
non_snake_case = "allow"
mismatched_lifetime_syntaxes = "allow"
